name: Atualizar dados do site

# Roda a cada 2 dias (cron não tem "a cada N dias" de verdade — dia-do-mês
# par é o jeito padrão de aproximar isso) e também pode ser disparado
# manualmente pela aba Actions no GitHub, sem precisar esperar o agendamento.
on:
  schedule:
    - cron: '0 8 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # As duas extrações rodam dentro da imagem Docker oficial da Playwright
      # (já vem com o Chromium instalado) em vez de "playwright install" —
      # baixar o binário do navegador em tempo de execução tomava
      # 403/AccessDenied do CDN deles nos runners do GitHub Actions. Rodamos
      # só ESSES dois passos via `docker run` (não o job inteiro dentro de
      # `container:`) porque colocar o job inteiro num container bagunçava o
      # `git` nos passos finais (checkout ficava "not in a git directory").
      - name: Extrair dados do AscensionLogs
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            node tools/scrape/ascension-logs.mjs

      - name: Extrair dados do BisBeard
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            node tools/scrape/bisbeard.mjs

      # Amostra pesada (centenas de chamadas, um relatório de log por vez)
      # pra estimar foco de cura em tank vs raid — feature nova e opcional,
      # não deve travar a atualização dos dados principais se falhar.
      - name: Extrair foco de cura em tanks (amostra, opcional)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            node tools/scrape/healer-tank-focus.mjs

      - name: Checagem de sanidade (aborta se os dados vierem incompletos)
        run: node tools/scrape/sanity-check.mjs

      - name: Gerar dados estáticos do site
        run: node tools/build-data.mjs

      - name: Baixar ícones novos
        run: node tools/download-icons.mjs

      - name: Build de verificação (garante que o site continua compilando)
        run: npx ng build

      - name: Commitar e enviar, se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/data/raw public/data public/icons
          if git diff --cached --quiet; then
            echo "Nenhum dado novo — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza dados do jogo ($(date -u +%Y-%m-%d))"

          # Se o main remoto avançou entre o checkout e agora (ex.: alguém
          # deu push nesse meio-tempo), sincroniza e tenta de novo em vez de
          # simplesmente falhar.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push ok."
              exit 0
            fi
            echo "Push rejeitado (tentativa $i/5) — sincronizando com origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase deu conflito — abortando."
              git rebase --abort
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "Não consegui enviar depois de várias tentativas."
          exit 1
